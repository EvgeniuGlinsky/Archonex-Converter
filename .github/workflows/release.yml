name: Release

# Driven by a tag, so what was built is always recoverable from the tag it was
# built at. Never on a branch push: a release is a decision, not a side effect of
# committing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the artifacts but publish nothing'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Kept in step with .github/workflows/ci.yml and the revision in .metadata.
  # Bump all three together, deliberately.
  FLUTTER_VERSION: 3.41.2

jobs:
  # Nothing is built until the same gate CI uses has passed. A red release is
  # worse than a late one.
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # The tag names the release; `pubspec.yaml` names the build. They have to
      # be the same thing, because the Android jobs below stamp the artifacts
      # from the pubspec and the filenames from the tag — and a mismatch would
      # ship `1.0.1` inside a file called `1.0.2` with nothing to catch it.
      - name: The tag must match the pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(sed -n 's/^version: *\([^+]*\)+.*$/\1/p' pubspec.yaml)"

          if [ "$tagged" != "$declared" ]; then
            echo "::error::Tag v$tagged does not match pubspec version $declared. Bump pubspec.yaml, or retag."
            exit 1
          fi

  android:
    name: Android
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # The keystore never lives in the repository. It arrives base64 encoded in a
      # secret, is written outside the working tree, and `key.properties` points at
      # it — the same file a developer writes by hand locally.
      #
      # A dispatch without the secrets still builds, debug-signed, so the workflow
      # can be rehearsed before a key exists. A tag is held to a higher standard
      # below: an artifact not signed with the upload key can never be updated,
      # and learning that after publishing is the expensive way to learn it.
      - name: Prepare signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::warning::Android signing secrets are not set — building unsigned. See android/key.properties.example."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          keystore="$RUNNER_TEMP/archonex-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"

          {
            echo "storeFile=$keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-archonex}"
            echo "keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}"
          } > android/key.properties

          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Until now `signed` was written and never read, so the guard it implies did
      # not exist: secrets could go missing and a debug-signed release would be
      # drafted on entirely green checkmarks. A tag is a release, so it fails here
      # instead.
      - name: Refuse an unsigned tag
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed != 'true'
        run: |
          echo "::error::This tag would publish an unsigned build. Set ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD."
          exit 1

      # Both Android builds take their version from `pubspec.yaml` and nowhere
      # else — no `--build-name`, no `--build-number`.
      #
      # The number is the reason. It becomes the Android versionCode, and Play
      # rejects a bundle whose code is not higher than the last one accepted,
      # permanently. `GITHUB_RUN_NUMBER` used to supply it: a counter of *this
      # workflow's* runs, unrelated to the tag and to the pubspec, which a
      # re-run, a rehearsal or a renamed workflow can send backwards. Read from
      # `pubspec.yaml` the code is in git, reviewable in the diff that bumps it,
      # and recoverable from the tag alone — which `verify` has already checked
      # names the same version.
      #
      # These two differ only in packaging. Nothing is sold on Android, so
      # neither carries `ARCHONEX_DISTRIBUTION=store` — see
      # `createSubscriptionRepo`, which answers before the define is read there.
      # It stayed on this step for a while doing nothing, which is worse than its
      # absence: a build script that names a switch implies the switch matters.
      - name: Build app bundle for Play
        run: flutter build appbundle --release

      - name: Build APK for direct download
        run: flutter build apk --release

      - name: Name the artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/archonex-converter-$version-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/archonex-converter-$version-play.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # FFmpegKit ships its Windows DLLs as a zip the plugin's own CMakeLists
      # downloads and unpacks with `cmake -E tar`. Flutter reaches the plugin
      # through `windows/flutter/ephemeral/.plugin_symlinks`, and libarchive
      # refuses to extract through a symlink — a defence against archives that
      # escape their destination — so the build dies before compiling anything.
      #
      # Unpacking it here, into the plugin's real directory in the pub cache,
      # avoids the symlink rather than arguing with it. The plugin records what it
      # already has in a marker file and skips the download entirely when that
      # matches what it wants, so writing the marker is what makes it stand down.
      #
      # Variant and version are read out of the plugin instead of pinned here: a
      # bump upstream would otherwise leave us unpacking an FFmpeg it was never
      # built against.
      - name: Unpack FFmpegKit into the pub cache
        shell: bash
        run: |
          set -euo pipefail

          # `dart pub cache list` rather than a guessed path — the cache location
          # differs between runner images, and its JSON states it outright.
          location="$(dart pub cache list \
            | grep -o '"ffmpeg_kit_flutter_new":{"[^"]*":{"location":"[^"]*' \
            | sed 's/.*"location":"//' \
            | sed 's|\\\\\\\\|/|g')"
          if [ -z "$location" ] || [ ! -d "$location" ]; then
            echo "::error::ffmpeg_kit_flutter_new is not in the pub cache — nothing to unpack into."
            exit 1
          fi

          cmakelists="$location/windows/CMakeLists.txt"
          default_of() {
            sed -n "s/^set($1 \"\([^\"]*\)\".*/\1/p" "$cmakelists" | head -1
          }
          version="$(default_of FFMPEGKIT_VERSION)"
          package="$(default_of FFMPEGKIT_PACKAGE)"
          if [ -z "$version" ] || [ -z "$package" ]; then
            echo "::error::could not read FFMPEGKIT_VERSION/FFMPEGKIT_PACKAGE from $cmakelists."
            exit 1
          fi

          zip="ffmpeg-kit-windows-x86_64-$package-$version.zip"
          url="https://github.com/sk3llo/ffmpeg_kit_flutter/releases/download/$version-$package/$zip"
          prebuilt="$location/windows/ffmpeg-kit"

          echo "Unpacking FFmpegKit $version ($package) into $prebuilt"
          rm -rf "$prebuilt"
          mkdir -p "$prebuilt"
          curl -fsSL --retry 3 -o "$prebuilt/$zip" "$url"
          7z x -y -o"$prebuilt" "$prebuilt/$zip" > /dev/null
          rm -f "$prebuilt/$zip"

          # The same file the plugin checks for, so a changed archive layout fails
          # here with a clear message rather than deep inside CMake.
          if [ ! -f "$prebuilt/bin/libffmpegkit.dll" ]; then
            echo "::error::$zip has no bin/libffmpegkit.dll — the archive layout changed."
            exit 1
          fi

          # Marker format taken from the plugin itself: "<version>-<variant>".
          printf '%s\n' "$version-$package" > "$prebuilt/bin/.ffmpegkit_variant"

      - name: Build
        shell: bash
        run: |
          flutter build windows --release \
            --build-name=${GITHUB_REF_NAME#v} \
            --build-number=${GITHUB_RUN_NUMBER}

      # A zip of the whole bundle, not just the exe: the Flutter runner needs the
      # DLLs and `data/` beside it, and an exe on its own would fail to start in a
      # way that looks like a corrupt download.
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cd build/windows/x64/runner/Release
          7z a -tzip "$GITHUB_WORKSPACE/dist/archonex-converter-$version-windows-x64.zip" ./*

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # What the Flutter Linux runner links against. `libmpv` is absent because no
      # FFmpeg engine ships on Linux — only the PDF converter runs there, and it
      # needs none.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - run: flutter pub get

      - name: Build
        run: |
          flutter build linux --release \
            --build-name=${GITHUB_REF_NAME#v} \
            --build-number=${GITHUB_RUN_NUMBER}

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          tar -czf "dist/archonex-converter-$version-linux-x64.tar.gz" \
            -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  publish:
    name: Draft the release
    needs: [android, windows, linux]
    # `dry_run` is offered only on a manual dispatch and is absent — so never
    # `true` — on a tag push. Until it was read here it was a checkbox promising
    # something the workflow did not honour.
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # A draft, never a live release. Someone has to read the notes and look at
      # the file list before this is in front of users — and the .aab has to go to
      # Play rather than here.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
          fail_on_unmatched_files: true

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Pinned rather than tracking `stable`, so a Flutter release cannot turn
      # CI red on its own. Keep in step with the revision in .metadata; bump it
      # deliberately, as its own commit, with the test run that proves it.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Unit and widget tests only. integration_test/ needs a real device and
      # is run by hand — see the README.
      - name: Test
        run: flutter test

name: Release

# Driven by a tag, so what was built is always recoverable from the tag it was
# built at. Never on a branch push: a release is a decision, not a side effect of
# committing.
#
# `rehearsal-*` builds everything and publishes nothing. It exists because the
# only honest test of a packaging change is the runner that will run it: whether
# Inno Setup is on the image, whether appimagetool survives without FUSE and what
# a split APK actually weighs are all questions no local machine can answer for
# GitHub's. `publish` below is gated on `v*` alone, so a rehearsal cannot leak.
on:
  push:
    tags:
      - 'v*'
      - 'rehearsal-*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the artifacts but publish nothing'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Kept in step with .github/workflows/ci.yml and the revision in .metadata.
  # Bump all three together, deliberately.
  FLUTTER_VERSION: 3.41.2

jobs:
  # Nothing is built until the same gate CI uses has passed. A red release is
  # worse than a late one.
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Every job below stamps and names its artifacts from this one number, read
      # from `pubspec.yaml` and passed down — never from the tag and never from
      # `GITHUB_RUN_NUMBER`. One source of truth means a rehearsal produces files
      # named exactly like the release it is rehearsing.
      - name: Read the version
        id: version
        run: |
          version="$(sed -n 's/^version: *\([^+]*\)+.*$/\1/p' pubspec.yaml)"
          if [ -z "$version" ]; then
            echo "::error::could not read a version out of pubspec.yaml."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      # The tag names the release; `pubspec.yaml` names the build. They have to
      # be the same thing, because the jobs below stamp the artifacts from the
      # pubspec — and a mismatch would ship `1.0.1` inside a release called
      # `1.0.2` with nothing to catch it.
      - name: The tag must match the pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="${{ steps.version.outputs.version }}"

          if [ "$tagged" != "$declared" ]; then
            echo "::error::Tag v$tagged does not match pubspec version $declared. Bump pubspec.yaml, or retag."
            exit 1
          fi

  android:
    name: Android
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # The keystore never lives in the repository. It arrives base64 encoded in a
      # secret, is written outside the working tree, and `key.properties` points at
      # it — the same file a developer writes by hand locally.
      #
      # A dispatch without the secrets still builds, debug-signed, so the workflow
      # can be rehearsed before a key exists. A tag is held to a higher standard
      # below: an artifact not signed with the upload key can never be updated,
      # and learning that after publishing is the expensive way to learn it.
      - name: Prepare signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::warning::Android signing secrets are not set — building unsigned. See android/key.properties.example."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          keystore="$RUNNER_TEMP/archonex-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"

          {
            echo "storeFile=$keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-archonex}"
            echo "keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}"
          } > android/key.properties

          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Until now `signed` was written and never read, so the guard it implies did
      # not exist: secrets could go missing and a debug-signed release would be
      # drafted on entirely green checkmarks. A tag is a release, so it fails here
      # instead.
      - name: Refuse an unsigned tag
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed != 'true'
        run: |
          echo "::error::This tag would publish an unsigned build. Set ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD."
          exit 1

      # Every Android build takes its version from `pubspec.yaml` and nowhere
      # else — no `--build-name`, no `--build-number`.
      #
      # The number is the reason. It becomes the Android versionCode, and Play
      # rejects a bundle whose code is not higher than the last one accepted,
      # permanently. `GITHUB_RUN_NUMBER` used to supply it: a counter of *this
      # workflow's* runs, unrelated to the tag and to the pubspec, which a
      # re-run, a rehearsal or a renamed workflow can send backwards. Read from
      # `pubspec.yaml` the code is in git, reviewable in the diff that bumps it,
      # and recoverable from the tag alone — which `verify` has already checked
      # names the same version.
      #
      # Every artifact here differs only in packaging. Nothing is sold on
      # Android, so none of them carries `ARCHONEX_DISTRIBUTION=store` — see
      # `createSubscriptionRepo`, which answers before the define is read there.
      # It stayed on this step for a while doing nothing, which is worse than its
      # absence: a build script that names a switch implies the switch matters.
      - name: Build app bundle for Play
        run: flutter build appbundle --release

      # Split by ABI, and copy the results out before anything else runs a Gradle
      # task that could overwrite them.
      #
      # Size is the whole reason. FFmpeg ships a native library per architecture,
      # and a universal APK carries all of them: a quarter of a gigabyte, of which
      # any given phone uses a third. Play solves this by splitting the bundle per
      # device; a direct download has nobody to do that for it, so it is done
      # here. `arm64` is what every phone sold in roughly the last decade runs.
      #
      # One surprise these carry: `--split-per-abi` rewrites the versionCode,
      # prefixing it per architecture — `1.0.1+2` becomes 1002 on armeabi-v7a and
      # 2002 on arm64-v8a, while the universal APK keeps the 2 the pubspec asked
      # for. Harmless here, because these are a distribution channel of their own:
      # Play re-signs with its own app signing key, so a Play build and a
      # downloaded one can never replace each other regardless of the number. It
      # is written down because the numbers look wrong and are not.
      - name: Build split APKs for direct download
        run: |
          flutter build apk --release --split-per-abi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "dist/Archonex-Converter-$VERSION-android-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             "dist/Archonex-Converter-$VERSION-android-arm32.apk"

      # The one that runs anywhere, including x86_64 Chromebooks and emulators,
      # kept as the answer to "the other one says it is not compatible".
      - name: Build universal APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/Archonex-Converter-$VERSION-android-universal.apk"

      - name: Report the sizes
        run: ls -lh dist/ | sed 's/^/  /'

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error

      # Kept apart from the artifacts above, and out of the release entirely. An
      # `.aab` is not an installable file — it is the archive Play opens to build
      # one per device — so on a download page it is a trap, and the APKs above
      # are what the same build produces for people who are not Play. Previously
      # it was attached to the draft and a line in the README asked a human to
      # remember to delete it.
      - name: Set the Play bundle aside
        run: |
          mkdir -p play
          cp build/app/outputs/bundle/release/app-release.aab \
             "play/Archonex-Converter-$VERSION-play.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          path: play/*
          if-no-files-found: error

  windows:
    name: Windows
    needs: verify
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # FFmpegKit ships its Windows DLLs as a zip the plugin's own CMakeLists
      # downloads and unpacks with `cmake -E tar`. Flutter reaches the plugin
      # through `windows/flutter/ephemeral/.plugin_symlinks`, and libarchive
      # refuses to extract through a symlink — a defence against archives that
      # escape their destination — so the build dies before compiling anything.
      #
      # Unpacking it here, into the plugin's real directory in the pub cache,
      # avoids the symlink rather than arguing with it. The plugin records what it
      # already has in a marker file and skips the download entirely when that
      # matches what it wants, so writing the marker is what makes it stand down.
      #
      # Variant and version are read out of the plugin instead of pinned here: a
      # bump upstream would otherwise leave us unpacking an FFmpeg it was never
      # built against.
      - name: Unpack FFmpegKit into the pub cache
        shell: bash
        run: |
          set -euo pipefail

          # `dart pub cache list` rather than a guessed path — the cache location
          # differs between runner images, and its JSON states it outright.
          location="$(dart pub cache list \
            | grep -o '"ffmpeg_kit_flutter_new":{"[^"]*":{"location":"[^"]*' \
            | sed 's/.*"location":"//' \
            | sed 's|\\\\\\\\|/|g')"
          if [ -z "$location" ] || [ ! -d "$location" ]; then
            echo "::error::ffmpeg_kit_flutter_new is not in the pub cache — nothing to unpack into."
            exit 1
          fi

          cmakelists="$location/windows/CMakeLists.txt"
          default_of() {
            sed -n "s/^set($1 \"\([^\"]*\)\".*/\1/p" "$cmakelists" | head -1
          }
          version="$(default_of FFMPEGKIT_VERSION)"
          package="$(default_of FFMPEGKIT_PACKAGE)"
          if [ -z "$version" ] || [ -z "$package" ]; then
            echo "::error::could not read FFMPEGKIT_VERSION/FFMPEGKIT_PACKAGE from $cmakelists."
            exit 1
          fi

          zip="ffmpeg-kit-windows-x86_64-$package-$version.zip"
          url="https://github.com/sk3llo/ffmpeg_kit_flutter/releases/download/$version-$package/$zip"
          prebuilt="$location/windows/ffmpeg-kit"

          echo "Unpacking FFmpegKit $version ($package) into $prebuilt"
          rm -rf "$prebuilt"
          mkdir -p "$prebuilt"
          curl -fsSL --retry 3 -o "$prebuilt/$zip" "$url"
          7z x -y -o"$prebuilt" "$prebuilt/$zip" > /dev/null
          rm -f "$prebuilt/$zip"

          # The same file the plugin checks for, so a changed archive layout fails
          # here with a clear message rather than deep inside CMake.
          if [ ! -f "$prebuilt/bin/libffmpegkit.dll" ]; then
            echo "::error::$zip has no bin/libffmpegkit.dll — the archive layout changed."
            exit 1
          fi

          # Marker format taken from the plugin itself: "<version>-<variant>".
          printf '%s\n' "$version-$package" > "$prebuilt/bin/.ffmpegkit_variant"

      - name: Build
        shell: bash
        run: flutter build windows --release

      # Two shapes of the same bundle, because they answer different questions.
      #
      # The installer is what a download page should offer: one file, double
      # clicked, no administrator rights, a Start Menu entry and an uninstaller.
      # The zip is for the person who will not run an unsigned installer — neither
      # is code-signed and SmartScreen warns about both, so refusing to ship the
      # portable copy would only send that person away with nothing.
      - name: Package the portable zip
        shell: bash
        run: |
          mkdir -p dist
          cd build/windows/x64/runner/Release
          7z a -tzip "$GITHUB_WORKSPACE/dist/Archonex-Converter-$VERSION-windows-x64-portable.zip" ./* > /dev/null

      # Inno Setup ships on the windows runner image. Installing it when it does
      # not is three lines; discovering it is missing halfway through a release is
      # not.
      - name: Find Inno Setup
        id: iscc
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            Write-Host "::warning::Inno Setup is not on the runner image - installing it."
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            Write-Host "::error::Inno Setup is still not at $iscc after installing it."
            exit 1
          }
          "path=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # PowerShell rather than bash: every argument here is a Windows path, and
      # MSYS bash rewrites both the leading `/D` switches and the paths behind them
      # on their way to a native executable. Escaping that is possible and
      # unreadable; not entering it is better.
      - name: Build the installer
        shell: pwsh
        run: |
          $version = '${{ needs.verify.outputs.version }}'
          $base = "Archonex-Converter-$version-windows-x64-setup"

          & '${{ steps.iscc.outputs.path }}' `
            "/DAppVersion=$version" `
            "/DBundleDir=$env:GITHUB_WORKSPACE\build\windows\x64\runner\Release" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\dist" `
            "/DOutputBase=$base" `
            "$env:GITHUB_WORKSPACE\packaging\windows\archonex.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not (Test-Path "dist\$base.exe")) {
            Write-Host "::error::ISCC reported success but produced no dist\$base.exe."
            exit 1
          }

      - name: Report the sizes
        shell: bash
        run: ls -lh dist/ | sed 's/^/  /'

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # What the Flutter Linux runner links against. `libmpv` is absent because no
      # FFmpeg engine ships on Linux — only the PDF converter runs there, and it
      # needs none.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - run: flutter pub get

      - name: Build
        run: flutter build linux --release

      - name: Package the tarball
        run: |
          mkdir -p dist
          tar -czf "dist/Archonex-Converter-$VERSION-linux-x64.tar.gz" \
            -C build/linux/x64/release/bundle .

      # An AppImage for the same reason Windows gets an installer: a tarball is a
      # file you have to know what to do with. This one is chmod +x and a double
      # click on any distribution new enough to run the GTK build.
      # Invoked through `bash` rather than executed: the repository is developed on
      # Windows, where git records no executable bit, and a script that is not +x
      # fails here with "permission denied" long after the change that dropped it.
      - name: Package the AppImage
        run: bash packaging/linux/build-appimage.sh "$VERSION" dist

      - name: Report the sizes
        run: ls -lh dist/ | sed 's/^/  /'

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [verify, android, windows, linux]
    # `dry_run` is offered only on a manual dispatch and is absent — so never
    # `true` — on a tag push. A `rehearsal-*` tag fails the first condition, which
    # is what makes a rehearsal safe to run against `main`.
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      # `release-*` only. The Play bundle is uploaded under a name this pattern
      # does not match, so it stays a workflow artifact and never reaches the
      # release — enforced here rather than asked for in the README.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Checksum every asset
        working-directory: artifacts
        run: |
          sha256sum ./* > SHA256SUMS.txt
          sed -i 's|\./||' SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Written here rather than left to `generate_release_notes` alone, because a
      # list of commit titles does not tell somebody which of seven files to
      # click. The generated log is appended below this table by the action.
      - name: Write the release notes
        run: |
          cat > notes.md <<EOF
          ## Download

          | Platform | File | What to do with it |
          | --- | --- | --- |
          | **Windows 10/11** | \`Archonex-Converter-$VERSION-windows-x64-setup.exe\` | Double click it. Windows will say the publisher is unknown — the build is not code-signed; choose **More info → Run anyway**. Installs for your user only, no administrator rights. |
          | Windows, portable | \`Archonex-Converter-$VERSION-windows-x64-portable.zip\` | Unpack anywhere and run \`archonex_converter.exe\`. Nothing is written outside the folder. |
          | **Android** | \`Archonex-Converter-$VERSION-android-arm64.apk\` | Every phone and tablet sold in roughly the last decade. Allow installing from your browser when asked. |
          | Android, older | \`Archonex-Converter-$VERSION-android-arm32.apk\` | 32-bit devices. Try this one if the file above refuses to install. |
          | Android, anything | \`Archonex-Converter-$VERSION-android-universal.apk\` | Runs everywhere, including x86 Chromebooks and emulators, and is about three times the size. |
          | **Linux x64** | \`Archonex-Converter-$VERSION-x86_64.AppImage\` | \`chmod +x\` it and run it. No installation, nothing needed beyond GTK 3. |
          | Linux, tarball | \`Archonex-Converter-$VERSION-linux-x64.tar.gz\` | Unpack and run \`archonex_converter\`. |

          \`SHA256SUMS.txt\` covers every file above.

          ## Before you download

          **Linux converts PDFs only.** No FFmpeg engine ships for it, so the media and image
          converters report themselves unavailable rather than failing halfway through. Windows and
          Android run all three.

          Nothing here talks to a network. Conversion happens on your own machine, at the platform's
          real size ceiling — no upload, no account, no server.

          ---
          EOF
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Archonex Converter ${{ env.VERSION }}
          body_path: notes.md
          generate_release_notes: true
          draft: false
          make_latest: true
          files: artifacts/*
          fail_on_unmatched_files: true
